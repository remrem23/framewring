name: Bug report / Сообщение об ошибке
description: Something does not work as expected. / Что-то работает не так.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! English or Russian is fine. / Спасибо! Можно писать по-русски или по-английски.
        Security issues: please do not report them here — see SECURITY.md. / Уязвимости — не здесь, см. SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Framewring version / Версия Framewring
      description: Shown in the window header. / Видна в шапке окна.
      placeholder: "0.9.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it? / Как запускаешь?
      options:
        - Installer / Установщик (setup.exe)
        - Portable / Портабл (zip)
        - From source / Из исходников (app.py)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Версия Windows
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver version / Видеокарта и версия драйвера
      placeholder: "RTX 4070, driver 576.xx / no Nvidia GPU"
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: FFmpeg version / Версия FFmpeg
      description: Shown at the top right of the window; for the exe also in ffmpeg\README.txt in the program folder. / Видна справа вверху окна; у exe — ещё в ffmpeg\README.txt в папке программы.
      placeholder: "ffmpeg version 8.1.1-full_build-www.gyan.dev"
  - type: input
    id: mode
    attributes:
      label: Mode and quality / Режим и качество
      placeholder: "Nvidia GPU · AV1, Balanced"
  - type: textarea
    id: what
    attributes:
      label: What happened? Steps to reproduce / Что случилось? Как повторить
      description: What you did, what you expected, what happened instead. Error text from the app helps. / Что делал, что ожидал, что получилось. Текст ошибки из программы очень помогает.
    validations:
      required: true
  - type: textarea
    id: video
    attributes:
      label: About the video / О видео
      description: Container, codec, resolution, frame rate, source (phone, OBS, camera…). Do not attach private videos. / Контейнер, кодек, разрешение, частота кадров, источник (телефон, OBS, камера…). Личные видео не прикладывай.
  - type: textarea
    id: log
    attributes:
      label: framewring.log
      description: |
        Installed: %APPDATA%\Framewring\framewring.log — Portable: data\framewring.log next to Framewring.exe — From source: copy the console output.
        The log contains paths to your videos: remove anything you don't want to share.
        Установленная: %APPDATA%\Framewring\framewring.log — Портабл: data\framewring.log рядом с Framewring.exe — Из исходников: скопируй вывод консоли.
        В журнале есть пути к твоим видео: убери то, чем не хочешь делиться.
      render: text
