# Build Framewring on a clean GitHub Windows machine.
#  - manually (Actions -> Build -> Run workflow): builds and uploads the files as a run artifact;
#  - on a vX.Y.Z tag: the same + a draft release with the installer, portable archive and SHA256SUMS.txt.
# The draft is published manually after checking. A provenance attestation
# (build provenance) is created for each file: gh attestation verify <file> -R remrem23/framewring
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write      # draft release
      id-token: write      # provenance attestation
      attestations: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app.py -Pattern '^__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match the version in app.py ($v)"
          }
          "Framewring $v"

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check -r packaging/requirements-build.txt

      # The ready-made PyInstaller bootloader is the same file in thousands of programs, and antivirus
      # heuristics fire on it. Build our own from the source archive (checked by SHA-256, packaging/pyinstaller.json)
      # and install PyInstaller with it. The log must show "Compiling the bootloader from source" and
      # "OK: installed PyInstaller ... uses the bootloader compiled from source".
      - name: PyInstaller with the bootloader compiled from source
        run: python packaging/build_pyinstaller.py

      - name: FFmpeg (checked by SHA-256)
        id: ff
        shell: pwsh
        run: |
          $d = python packaging/get_ffmpeg.py
          if ($LASTEXITCODE) { throw "FFmpeg" }
          "dir=$d" >> $env:GITHUB_OUTPUT

      - name: Tests (CPU compression, replace originals, history)
        run: python tests/run_all.py --ffmpeg-dir "${{ steps.ff.outputs.dir }}"

      - name: Build
        run: python packaging/build.py --ffmpeg-dir "${{ steps.ff.outputs.dir }}"

      - name: Smoke test (the app starts and answers)
        shell: pwsh
        run: |
          $p = Start-Process build\dist\Framewring\Framewring.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep 1
            if ($p.HasExited) { break }
            foreach ($port in 8765..8770) {
              try {
                $r = Invoke-RestMethod "http://127.0.0.1:$port/api/ping" -TimeoutSec 2 -NoProxy
                if ($r.app -eq "Framewring") { $ok = $true; "answers on port $port after $i s"; break }
              } catch {}
            }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Process Framewring -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "Framewring.exe did not answer on /api/ping" }

      - name: Installer, portable zip, checksums
        run: python packaging/release.py

      - name: List files
        shell: pwsh
        run: |
          Get-ChildItem build\release | Format-Table Name, Length
          Get-Content build\release\SHA256SUMS.txt

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            build/release/Framewring-*-setup.exe
            build/release/Framewring-*-portable.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Framewring-${{ steps.ver.outputs.version }}
          path: build/release/
          retention-days: 14
          compression-level: 0

      - name: Draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          $files = @(Get-ChildItem build\release\Framewring-$env:VER-setup.exe, build\release\Framewring-$env:VER-portable.zip, build\release\SHA256SUMS.txt | ForEach-Object FullName)
          $draft = gh release view $env:TAG -R $env:GITHUB_REPOSITORY --json isDraft -q .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            # a published release is left alone: its files are already downloaded and verified
            if ($draft -ne "true") { throw "Release $env:TAG is already published - not replacing its files" }
            gh release upload $env:TAG @files --clobber -R $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG @files --draft --title "Framewring $env:VER" -R $env:GITHUB_REPOSITORY `
              --notes "Built by GitHub Actions: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          }
          if ($LASTEXITCODE) { throw "gh release" }
